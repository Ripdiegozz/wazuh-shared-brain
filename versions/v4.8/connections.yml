connections:
  - from: "wazuh-agent"
    to: "remoted"
    type: "INVOKES"
    weight: "CRITICAL"
    description: "Sends encrypted event stream to manager"
  - from: "remoted"
    to: "analysisd"
    type: "INVOKES"
    weight: "CRITICAL"
    description: "Pushes raw agent payloads into event queue"
  - from: "analysisd"
    to: "json-decoder"
    type: "INVOKES"
    weight: "STANDARD"
    description: "Dispatches JSON logs to decoder"
  - from: "syscheckd"
    to: "analysisd"
    type: "INVOKES"
    weight: "STANDARD"
    description: "Reports file hash change events to analysis queue"
