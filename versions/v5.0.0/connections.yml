connections:
  - from: "wazuh-agent"
    to: "wazuh-manager"
    type: "INVOKES"
    weight: "CRITICAL"
    description: "Transmits compressed TLS event stream to manager"
  - from: "wazuh-manager"
    to: "wazuh-engine"
    type: "INVOKES"
    weight: "CRITICAL"
    description: "Pushes normalized WCS event batches to Rust engine"
  - from: "wazuh-engine"
    to: "wazuh-indexer"
    type: "INVOKES"
    weight: "CRITICAL"
    description: "Indexes generated alerts and telemetry documents"
  - from: "wazuh-dashboard"
    to: "wazuh-indexer"
    type: "READS"
    weight: "CRITICAL"
    description: "Queries alert records, visualizations, and saved objects"
  - from: "wazuh-dashboard"
    to: "wazuh-manager"
    type: "INVOKES"
    weight: "STANDARD"
    description: "Controls agent management, API status, and cluster configuration"
